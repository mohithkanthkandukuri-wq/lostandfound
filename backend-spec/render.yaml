services:
  # 1. Frontend: React + Vite Static Site
  - type: static
    name: campus-lostfound-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campus-lostfound-backend.onrender.com/api
      - key: VITE_DEMO_MODE
        value: true

  # 2. Backend: Java Spring Boot Web Service
  - type: web
    name: campus-lostfound-backend
    env: docker
    dockerfilePath: ./Dockerfile
    rootDir: backend
    plan: free
    healthCheckPath: /api/items/recent
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: campus-lostfound-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: 8080

databases:
  # 3. Managed PostgreSQL Database
  - name: campus-lostfound-db
    plan: free
    databaseName: lost_found_db
    user: lost_found_user
